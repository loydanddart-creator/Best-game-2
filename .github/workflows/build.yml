name: Build PS1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y make curl jq unzip

      - name: Download PSn00bSDK
        run: |
          mkdir -p $HOME/sdk
          cd $HOME/sdk
          curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("linux.zip")) | .browser_download_url' \
            > urls.txt
          cat urls.txt
          while read url; do
            name=$(basename "$url")
            curl -L -o "$name" "$url"
            unzip -q -o "$name"
          done < urls.txt
          find $HOME/sdk -maxdepth 3 | head -n 60

      - name: Build
        run: |
          PROLOGUE=$(find $HOME/sdk -name prologue.mk | head -n1)
          export PSN00BSDK_LIBS=$(dirname "$PROLOGUE")
          export PATH=$(find $HOME/sdk -type d -name bin | tr '\n' ':')$PATH
          echo "PSN00BSDK_LIBS=$PSN00BSDK_LIBS"
          which mipsel-none-elf-gcc || which mipsel-unknown-elf-gcc || echo "compiler not found"
          make

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-ps1
          path: |
            *.exe
            *.bin
            *.cue
          if-no-files-found: warn
