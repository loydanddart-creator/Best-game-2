name: Build PS1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y make curl jq unzip

      - name: Download PSn00bSDK
        run: |
          mkdir -p $HOME/sdk
          cd $HOME/sdk
          curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            > urls.txt
          while read url; do
            name=$(basename "$url")
            curl -L -o "$name" "$url"
            unzip -q -o "$name" || echo "skip $name"
          done < urls.txt

      - name: List SDK files
        run: |
          echo "--- .mk / .ld / .a files:"
          find $HOME/sdk -type f \( -name "*.mk" -o -name "*.ld" -o -name "*.a" \) | head -150
          echo "--- Linux lib dir:"
          ls -la $HOME/sdk/PSn00bSDK-0.24-Linux/lib/libpsn00b 2>/dev/null | head -80

      - name: Build
        run: |
          PROLOGUE=$(find $HOME/sdk -name prologue.mk | head -n1)
          if [ -z "$PROLOGUE" ]; then
            echo "prologue.mk not found, see the listing above"
            exit 1
          fi
          export PSN00BSDK_LIBS=$(dirname "$PROLOGUE")
          export PATH=$(find $HOME/sdk -type d -name bin | tr '\n' ':')$PATH
          make

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-ps1
          path: |
            *.exe
            *.bin
            *.cue
          if-no-files-found: warn
