name: Build PS1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make curl jq unzip

      - name: Download PSn00bSDK
        run: |
          mkdir -p $HOME/sdk
          cd $HOME/sdk
          curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            > urls.txt
          while read url; do
            name=$(basename "$url")
            curl -L -o "$name" "$url"
            unzip -q -o "$name" || echo "skip $name"
          done < urls.txt

      - name: Build with CMake
        run: |
          LIBS=$(find $HOME/sdk -type d -path "*lib/libpsn00b" | grep -v win32 | head -n1)
          TOOLCHAIN=$(find $HOME/sdk -name "sdk.cmake" | grep -v win32 | head -n1)
          export PSN00BSDK_LIBS="$LIBS"
          export PATH=$(find $HOME/sdk -type d -name bin | grep -v win32 | tr '\n' ':')$PATH
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Convert ELF to PS-EXE
        run: |
          ELF2X=$(find $HOME/sdk -name elf2x | grep -v win32 | head -n1)
          echo "Using $ELF2X"
          "$ELF2X" -q build/unicorn.elf
          ls -la build/

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-ps1
          path: |
            build/unicorn.exe
            build/unicorn.elf
          if-no-files-found: warn
